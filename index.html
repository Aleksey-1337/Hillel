<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const N = +prompt("Введи число N:");
let result = "";

for (let i = 1; i <= 100; i++) {
  if (i * i <= N) {
    result += i + " ";
  }
}

console.log(`Число, квадрат которого не превышат ${N}:`);
console.log(result.trim());

    </script>
</body>
</html>
