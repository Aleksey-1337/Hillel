<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const number = +prompt("Введите целое число для проверки:");

if (number <= 1) {
  alert("Число должно быть больше 1, что бы быть простым");
} else {
  let isPrime = true;

  for (let i = 2; i <= Math.sqrt(number); i++) {
    if (number % i === 0) {
      isPrime = false;
      break;
    }
  }

  if (isPrime) {
    alert(`${number} — Это простое число`);
  } else {
    alert(`${number} — Не простое число`);
  }
}

    </script>
</body>
</html>
