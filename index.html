<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getAverageOfNumbers(arr) {
            let sum = 0;
            let count = 0;

            for (let item of arr) {
                if (typeof item === 'number' && !isNaN(item)) {
                    sum += item;
                    count++;
                }
            }

            return count > 0 ? sum / count : 0;
        }
        const mixedArray = [10, 'hello', true, 25, null, 15, '5', NaN];
        const avg = getAverageOfNumbers(mixedArray);

        console.log(`Среднее арифметическое чисел в масиве: ${avg}`);

    </script>
</body>
</html>
