<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Смена цвета текста</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="text-block">Смена цвета!</div>
  <button onclick="toggleColor()">Сменить цвет</button>

  <script>
    function toggleColor() {
      const block = document.getElementById("text-block");
      block.classList.toggle("colored");
    }
  </script>
</body>
</html>
