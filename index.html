<body>
    <script>
        let company = {
  sales: [
    { name: 'Olga', salary: 1200 },
    { name: 'Ihor', salary: 700 }
  ],
  development: {
    web: [
      { name: 'Taras', salary: 2100 },
      { name: 'Nadia', salary: 1900 }
    ],
    internals: [
      { name: 'Mykola', salary: 1350 }
    ]
  },
  marketing: [
    { name: 'Andriy', salary: 1600 },
    { name: 'Yulia', salary: 1500 },
    { name: 'Roman', salary: 1400 },
    { name: 'Svitlana', salary: 1300 },
    { name: 'Denys', salary: 1250 }
  ]
};

function sumSalaries(department) {
  if (Array.isArray(department)) {
    return department.reduce((sum, employee) => sum + employee.salary, 0);
  } else {
    let sum = 0;
    for (let subdep of Object.values(department)) {
      sum += sumSalaries(subdep);
    }
    return sum;
  }
}

console.log(sumSalaries(company));

    </script>
