<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function askNumber () {
            let input = null;

            for (let i = 0; i < 10; i++) {
                input = prompt ("Введите число больше 100:");

                if (input ===null) {
                    console.log("Ввод отменено.");
                    return;
                }

            }
            
            const number = +input;

            if (number > 100) {
                console.log('Вы ввели: ${number} - больше 100, завершение.');
                return;
                
            }
            console.log('Цикл завершился. Последние введенное значение: ${input}');
        }
        askNumber();
    </script>
</body>
</html>
