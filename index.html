<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Форма</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="contact_section">
    <div class="contact_form">
      <h5>We would like to help you</h5>
      <form id="contactForm">
        <div class="form-group">
          <input type="text" name="name" placeholder="Name" class="form-control" />
          <small class="error-message"></small>
        </div>
        <div class="form-group">
          <textarea name="message" placeholder="Message" class="form-control" rows="3"></textarea>
          <small class="error-message"></small>
        </div>
        <h6>How to answer you?</h6>
        <div class="form-group">
          <input type="tel" name="phone" placeholder="Phone number" class="form-control" />
          <small class="error-message"></small>
        </div>
        <div class="form-group">
          <input type="email" name="email" placeholder="Email" class="form-control" />
          <small class="error-message"></small>
        </div>
        <div class="text-center send_message d-flex justify-content-center align-items-center">
          <button class="btn" type="submit">Send</button>
        </div>
      </form>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
